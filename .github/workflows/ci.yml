name: SSMS Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Test Core Engine Import
      run: |
        python -c "import lincore; print('Lincore imported successfully!')"
         
    - name: Test Backend Execution
      run: |
        # Quick 1-day trace to ensure math doesn't crash on standard setups
        python mission_campaign/runner.py temp/custom_run/config.yaml --output_dir test_ci --run_id ci_run
